name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: Node.js hazırla
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Testleri çalıştır
        run: npm test
      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5
      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
